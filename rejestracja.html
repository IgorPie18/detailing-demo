<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Załóż panel · Detailo</title>
<meta name="description" content="Załóż panel rezerwacji dla swojego studia detailingu: dane firmy, stanowiska, zespół i funkcje. 5 minut, bez karty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Kreator rejestracji: po lewej kroki, po prawej podgląd panelu na żywo (na telefonie podgląd w podsumowaniu). */
:root{
  --brand:#ea580c;--brand-600:#c2410c;--brand-700:#9a3412;--brand-50:#fff4ed;--brand-100:#ffe4d3;
  --ink:#1c1917;--ink-2:#44403c;--grey:#57534e;--grey-2:#78716c;--grey-3:#a8a29e;
  --line:#ebebe8;--line-2:#e4e4e1;--bg:#f8f8f7;--paper:#fff;
  --ok:#15803d;--ok-bg:#f0fdf4;--bad:#b91c1c;--bad-bg:#fef2f2;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-600)}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* górny pasek */
.top{position:sticky;top:0;z-index:20;background:rgba(248,248,247,.96);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;min-height:44px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);box-shadow:inset 0 -7px 0 rgba(0,0,0,.14)}
.top .has{margin-left:auto;font-size:14px;color:var(--grey)}
.top .has a{font-weight:600;display:inline-flex;align-items:center;min-height:44px}

/* pasek kroków */
.steps{max-width:1180px;margin:18px auto 0;padding:0 16px;display:flex;gap:6px;list-style:none}
.steps li{flex:1;min-width:0}
.steps button{width:100%;border:0;background:none;padding:0;text-align:left;display:grid;gap:7px;font-size:13px;color:var(--grey-2);font-weight:500;min-height:44px;align-content:start}
.steps button:disabled{cursor:default}
.steps button::before{content:"";height:4px;border-radius:99px;background:var(--line-2);transition:background .3s var(--ease)}
.steps li.done button::before,.steps li.cur button::before{background:var(--brand)}
.steps li.cur button{color:var(--ink);font-weight:600}
.steps li.done button{color:var(--ink-2)}
.steps li.done button:hover{color:var(--brand-600)}
.steps .n{font-variant-numeric:tabular-nums}
.mstep{display:none}

/* układ */
.wrap{max-width:1180px;margin:22px auto 60px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:32px 34px;box-shadow:0 20px 50px -34px rgba(28,25,23,.35)}
.card h1{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.025em}
.card .lead{margin:8px 0 0;color:var(--grey);font-size:15.5px;max-width:58ch}
.pane{display:grid;gap:22px}
.pane.in{animation:rise .38s var(--ease) both}
.pane.fwd{animation:slideF .34s var(--ease) both}
.pane.back{animation:slideB .34s var(--ease) both}
@keyframes slideF{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slideB{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
.plan{display:inline-flex;align-items:center;gap:8px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-700);border-radius:999px;padding:4px 6px 4px 12px;font-size:13.5px;font-weight:500;width:max-content;max-width:100%}
.planrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pane>*,.svcs>*,.svc>*,.svc-f>*{min-width:0}.dur input{width:100%}.svc-top input.nm{flex:1;min-width:0}
@media (max-width:720px){.bill button{white-space:normal;line-height:1.2;padding:4px 10px}}
.bill{display:inline-flex;background:#f1f1ef;border-radius:999px;padding:3px;gap:2px}
.bill button{border:0;background:none;border-radius:999px;min-height:38px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--grey)}
.bill button[aria-checked=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,25,23,.12)}
.bill em{font-style:normal;font-size:11px;color:#15803d}
.plan select{border:0;background:#fff;border-radius:999px;padding:6px 10px;font-size:16px;font-weight:600;color:var(--ink);min-width:0;max-width:100%;text-overflow:ellipsis}
@media (max-width:720px){.planrow .plan{width:100%}.planrow .plan select{flex:1}.planrow .bill{width:100%}.bill button{flex:1}}

/* pola */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.full{grid-column:1/-1}
.f{display:grid;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2);align-content:start}
.f .opt{font-weight:400;color:var(--grey-2)}
.f input,.f select,.f textarea{width:100%;height:48px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;background:#fff;font-size:16px;color:var(--ink);transition:border-color .18s,box-shadow .18s}
.f textarea{height:auto;min-height:104px;padding:12px 14px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.f input[aria-invalid=true],.f select[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.f input::placeholder,.f textarea::placeholder{color:var(--grey-3)}
.hint{font-size:13px;font-weight:400;color:var(--grey-2);line-height:1.45}
.err{font-size:13.5px;font-weight:500;color:var(--bad);display:flex;gap:6px;align-items:flex-start}
.okm{font-size:13.5px;color:var(--ok);font-weight:500}
.pw{position:relative}
.pw input{padding-right:52px}
.eye{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;border-radius:9px;background:none;color:var(--grey-2);display:grid;place-items:center}
.eye:hover{background:#f1f1ef;color:var(--ink)}
.meter{height:4px;border-radius:99px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--grey-3);transition:width .25s var(--ease),background .25s}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px;color:var(--ink-2);cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand-600);flex:none}
.check.bad{border-color:var(--bad);background:var(--bad-bg)}
.box{border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.box h2{margin:0;font-size:16px;font-weight:600}
.box h2 small{font-weight:400;color:var(--grey-2);font-size:13.5px;margin-left:6px}

/* godziny */
.hrs{display:grid;gap:10px}
.hr{display:grid;grid-template-columns:140px auto minmax(0,1fr);gap:12px;align-items:center;min-height:48px}
.hr b{font-weight:500;font-size:14.5px}
.hr .t{display:flex;align-items:center;gap:8px}
.hr select{height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 10px;font-size:16px;background:#fff}
.hr .closed{color:var(--grey-2);font-size:14px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--grey-3);border:0;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-pressed=true]{background:var(--brand-600)}
.sw[aria-pressed=true]::after{left:21px}
.sw-hit{display:inline-grid;place-items:center;min-width:44px;min-height:44px;margin:-9px 0}
.sw::before{content:"";position:absolute;inset:-9px -4px}

/* stanowiska */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;width:max-content}
.stepper button{width:52px;height:52px;border:0;background:#fff;font-size:22px;font-weight:500;color:var(--ink)}
.stepper button:hover:not(:disabled){background:var(--brand-50);color:var(--brand-700)}
.stepper button:disabled{color:var(--grey-3);cursor:not-allowed}
.stepper output{min-width:64px;text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bays{display:grid;gap:12px}
.bay{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bay.new{animation:rise .3s var(--ease) both}
.bay .no{width:36px;height:36px;border-radius:10px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;font-weight:700;grid-row:span 2}
.bay input{height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:16px;width:100%}
.bay input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.chip[aria-pressed=true]{background:var(--brand-50);border-color:var(--brand);color:var(--brand-700)}
.chip[aria-pressed=true]::before{content:"✓";font-weight:700}
.chip:hover{border-color:var(--grey-3)}

.addcat{display:flex;gap:8px;grid-column:2;flex-wrap:wrap}
.cbx{position:relative;flex:1;min-width:180px}
.addcat input{width:100%;height:44px;border:1px dashed var(--grey-3);border-radius:10px;padding:0 12px;font-size:16px;background:#fff}
.addcat input:focus{outline:0;border-style:solid;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.addcat button{min-height:44px;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:0 14px;font-weight:600;color:var(--ink-2)}
.addcat button:hover{border-color:var(--brand);color:var(--brand-700)}
.chip.new{animation:pinC .4s var(--ease)}
.cchip{background:var(--brand-50);border-color:var(--brand);color:var(--brand-700);padding-right:4px}
.cchip::before{content:"✓";font-weight:700}
.cx{width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--brand-700);display:grid;place-items:center;font-size:18px;line-height:1;margin-left:2px}
.cx:hover{background:#fff;color:var(--bad)}
.cl{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;list-style:none;margin:0;padding:6px;background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px -18px rgba(28,25,23,.35);max-height:240px;overflow:auto;animation:dropIn .16s var(--ease)}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cl li{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-2);min-height:44px;display:flex;align-items:center;gap:8px}
.cl li[aria-selected=true],.cl li:hover{background:var(--brand-50);color:var(--brand-700)}
.cl li mark{background:none;color:inherit;font-weight:700}
.cl li.add{color:var(--brand-700);font-weight:600}
.cl li small{margin-left:auto;color:var(--grey-2);font-size:12.5px}
.skip{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px dashed var(--grey-3);border-radius:16px;padding:16px 18px;background:repeating-linear-gradient(135deg,#fafaf9 0 12px,#f6f6f4 12px 24px)}
.skip .si{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--brand-600);box-shadow:0 2px 6px rgba(28,25,23,.08)}
.skip b{display:block;font-size:15px}.skip span{color:var(--grey);font-size:14px}
.skip .btn{min-height:44px;font-size:14.5px;white-space:nowrap}
.emailfix{border:1px solid #fecaca;background:var(--bad-bg);border-radius:16px;padding:16px 18px;display:grid;gap:12px;animation:rise .3s var(--ease) both}
.emailfix h2{margin:0;font-size:16px;color:var(--bad)}
.emailfix p{margin:0;color:var(--ink-2);font-size:14px}
.feat .pbadge{animation:pinC .3s var(--ease)}
.feat{transition:border-color .3s,background .3s,box-shadow .3s,opacity .3s}
.feat small{transition:color .3s}
@keyframes pinC{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

/* usługi */
.svcs{display:grid;gap:10px}
.svc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:12px;transition:border-color .2s,background .2s}
.svc.on{border-color:var(--brand-100);background:linear-gradient(180deg,#fffaf6,#fff 60%)}
.svc-top{display:flex;align-items:center;gap:12px;min-height:44px}
.svc-top .nm{flex:1;min-width:0;font-weight:600}
.svc-top .nm small{display:block;font-weight:400;color:var(--grey-2);font-size:13px}
.svc-top input.nm{height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:16px;font-weight:500}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--grey-3);background:#fff;flex:none;display:grid;place-items:center;position:relative;transition:all .18s}
.tick::before{content:"";position:absolute;inset:-9px}
.tick[aria-pressed=true]{background:var(--brand-600);border-color:var(--brand-600)}
.tick[aria-pressed=true]::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.svc-f{display:grid;grid-template-columns:130px 180px minmax(0,1fr);gap:10px 12px;align-items:end}
.svc-f .err{grid-column:1/-1}
.svc-f .f input,.svc-f .f select{height:44px}
.dur{display:flex;gap:6px}.dur input{min-width:0}.dur select{width:auto}
.svc-f .who{grid-column:1/-1;display:grid;gap:6px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.chip.sm{min-height:36px;font-size:13.5px;padding:4px 12px}
.skipbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}

/* plany i upsell */
.pbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--brand-700);background:var(--brand-50);border:1px solid var(--brand-100);border-radius:999px;padding:2px 8px;margin-top:4px;width:max-content}
.feat.locked{background:#fafaf9;border-style:dashed}
.feat.locked b,.feat.locked small{color:var(--grey-2)}
.feat.fixed{cursor:default}
.up{border:1px solid var(--brand);border-radius:16px;padding:16px 18px;display:grid;gap:10px;background:linear-gradient(135deg,var(--brand-50),#fff 70%);box-shadow:0 14px 30px -22px rgba(194,65,12,.6);animation:rise .3s var(--ease) both}
.up h3{margin:0;font-size:16px}
.up ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px;display:grid;gap:3px}
.up .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.up .btn{min-height:44px;font-size:14.5px}
.demo-n{font-size:13px;color:var(--grey-2)}

/* zespół */
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:#f1f1ef;border-radius:14px;padding:4px;gap:4px;max-width:420px}
.seg button{border:0;background:none;border-radius:10px;min-height:46px;padding:8px 14px;font-weight:600;color:var(--grey);font-size:14.5px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(28,25,23,.12)}
.mem{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 96px 44px;gap:10px;align-items:start}
.mem.new{animation:rise .3s var(--ease) both}
.mem .del{margin-top:27px}
.mem .f input,.mem .f select{height:44px}
.del{width:44px;height:44px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:var(--grey);display:grid;place-items:center}
.del:hover{color:var(--bad);border-color:#fecaca;background:var(--bad-bg)}
.addb{justify-self:start;min-height:44px;border:1px dashed var(--grey-3);background:#fff;border-radius:12px;padding:8px 16px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.addb:hover{border-color:var(--brand);color:var(--brand-700);background:var(--brand-50)}
.note{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--grey);display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;color:var(--brand-600);margin-top:2px}

/* funkcje */
.always{display:flex;flex-wrap:wrap;gap:8px}
.always span{font-size:13.5px;background:#f1f1ef;border-radius:999px;padding:6px 12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.always span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;min-height:72px;transition:border-color .18s,background .18s,box-shadow .18s}
.feat:hover{border-color:var(--grey-3)}
.feat[aria-pressed=true]{border-color:var(--brand);background:linear-gradient(0deg,var(--brand-50),#fff 70%);box-shadow:0 0 0 1px var(--brand) inset}
.feat .fi{width:40px;height:40px;border-radius:11px;background:#f1f1ef;display:grid;place-items:center;color:var(--grey)}
.feat[aria-pressed=true] .fi{background:#fff;color:var(--brand-600)}
.feat b{display:block;font-weight:600;font-size:14.5px}
.feat small{display:block;color:var(--grey-2);font-size:13px;line-height:1.4;margin-top:2px}
.feat .sw{pointer-events:none}
.feat[aria-pressed=true] .sw{background:var(--brand-600)}
.feat[aria-pressed=true] .sw::after{left:21px}
.fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fhead .cnt{font-size:13.5px;color:var(--grey-2)}
.lnk{border:0;background:none;color:var(--brand-600);font-weight:600;padding:0 4px;min-height:44px;font-size:14px}
.lnk:hover{text-decoration:underline}
.wish{border:1px solid var(--brand-100);background:linear-gradient(180deg,var(--brand-50),#fff);border-radius:16px;padding:18px;display:grid;gap:12px}
.wish h2{margin:0;font-size:16px;font-weight:600}
.wish p{margin:0;color:var(--grey);font-size:14px}
.idea{min-height:36px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--ink-2)}
.idea:hover{border-color:var(--brand);color:var(--brand-700)}

/* podsumowanie */
.sum{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding:10px 0}
.srow:last-child{border-bottom:0}
.srow dt{color:var(--grey-2);font-size:14px;margin:0}
.srow dd{margin:0;font-weight:500;font-size:14.5px;overflow-wrap:anywhere}
.srow dd small{display:block;font-weight:400;color:var(--grey-2)}
.srow .lnk{min-height:28px}
.linkbox{display:grid;gap:4px;background:var(--bg);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.linkbox b{font-weight:600}

/* akcje */
.acts{display:flex;align-items:center;gap:12px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:20px}
.acts .sp{flex:1}
.btn{min-height:50px;border:0;border-radius:12px;padding:0 22px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background-color .18s,transform .2s var(--ease)}
.btn:active{transform:scale(.98)}

/* podgląd panelu */
.pv{position:sticky;top:84px;display:grid;gap:12px}
.pv-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-2);display:flex;align-items:center;gap:8px}
.pv-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.mock{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:132px minmax(0,1fr);min-height:420px;box-shadow:0 24px 60px -36px rgba(28,25,23,.45);font-size:12px}
.m-side{background:#fbfbfa;border-right:1px solid var(--line);padding:12px 8px;display:grid;align-content:start;gap:2px}

.m-hi{font-size:15px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.m-sub{color:var(--grey-2);margin-top:-8px}

.m-pills div{background:var(--bg);border-radius:8px;padding:7px}
.m-pills b{display:block;font-size:15px}
.m-pills span{color:var(--grey-2);font-size:10.5px}

/* tworzenie panelu */
.making{display:grid;gap:18px;justify-items:start}

.making li.ok i{background:var(--ok);border-color:var(--ok)}
.making li.ok i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

  {tpl:'ceramika',name:'Powłoka ceramiczna',cat:'lakier',price:1900,unit:'d',dur:2},{tpl:'ppf',name:'Folia ochronna PPF',cat:'lakier',price:3900,unit:'d',dur:3}];

const pp=k=>!PM[k]?'0 zł':D.billing==='year'?`${PM[k][1]} zł netto/mies., rocznie`:`${PM[k][0]} zł netto/mies.`;
const GAIN={salon:['do 3 stanowisk i 5 osób w zespole','wyceny z wariantami, gwarancje i przeglądy','lista rezerwowa, bony prezentowe i punkty'],studio:['bez limitu stanowisk i osób','statystyki, Google i powiadomienia na Telegramie','pomoc przy wdrożeniu i przeniesieniu klientów']};
// klucze jak w panelu (salon.html, FEATS + loy i tg); kolejność = kolejność w menu
const FEATS=[['wyc','Wyceny z wariantami','Klient wybiera wariant i dodatki w linku, akceptacja wraca do panelu','Sprzedaż'],
  ['gw','Gwarancje i przeglądy','Karta gwarancyjna z QR i przypomnienie o przeglądzie powłoki','Sprzedaż'],

const IDEAS=['Faktury z Fakturowni','Import klientów z Booksy','Karnety na mycie','Magazyn chemii','SMS-y marketingowe','Zdjęcia przed i po dla klienta'];
const TIMES=(()=>{const a=[];for(let h=6;h<=22;h++)for(const m of ['00','30'])if(!(h===22&&m==='30'))a.push(`${String(h).padStart(2,'0')}:${m}`);return a})();

const COLORS=['#1c1917','#c2410c','#0f766e','#4338ca','#a16207','#be185d'];

  salon:'',phone:'',addr:'',zip:'',city:'',nip:'',week:['08:00','18:00'],sat:true,satT:['09:00','14:00'],sun:false,sunT:['10:00','14:00'],

  solo:true,team:[],feats:Object.fromEntries(FEATS.map(f=>[f[0],true])),featsTouched:false,wish:'',sample:true}}
let D=fresh(), step=0, E={}, emailTaken=false, making=false;
const qp=new URLSearchParams(location.search).get('plan');
try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');if(d&&typeof d==='object'){D={...D,...d,pw:'',terms:false,upsell:null};D.restored=true}}catch(_){}

{const ok=new URLSearchParams(location.search).get('okres');if(ok==='rok')D.billing='year';else if(ok==='miesiac')D.billing='month';else if(!D.billing)D.billing='year'}

/* ---------- pomocnicze ---------- */
const digits=s=>String(s||'').replace(/\D/g,'');
const slugify=s=>(s||'').toLowerCase().replace(/[ąćęłńóśźż]/g,c=>'acelnoszz'['ąćęłńóśźż'.indexOf(c)]).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30)||'twoj-salon';
const hm=t=>t.replace(/^0/,'');
const hoursTxt=()=>[`pn-pt ${hm(D.week[0])}-${hm(D.week[1])}`,D.sat?`sb ${hm(D.satT[0])}-${hm(D.satT[1])}`:'',D.sun?`nd ${hm(D.sunT[0])}-${hm(D.sunT[1])}`:''].filter(Boolean).join(', ');
const nipOk=n=>{const d=digits(n);if(d.length!==10)return false;const w=[6,5,7,2,3,4,5,6,7];const s=w.reduce((a,x,i)=>a+x*+d[i],0)%11;return s!==10&&s===+d[9]};
const phoneOk=p=>{const d=digits(p);return d.length===9||(d.length===11&&d.startsWith('48'))};
const first=s=>(s||'').trim().split(/\s+/)[0]||'';
const pl=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const hasTeam=()=>!D.solo&&D.team.some(m=>m.name.trim());
const locked=k=>RANK[D.plan]<RANK[NEED[k]];
// włączona naprawdę: wybrana i w planie; zespół zostaje, gdy dodano pracowników
const fOn=k=>(k==='zes'&&hasTeam())||!!D.feats[k];
const featOn=()=>FEATS.filter(f=>fOn(f[0])&&!locked(f[0]));
const catName=id=>(D.cats.find(c=>c.id===id)||{name:id}).name;
const DEF=['mycie','lakier'];
const norm=x=>String(x||'').toLowerCase().replace(/[ąćęłńóśźż]/g,c=>'acelnoszz'['ąćęłńóśźż'.indexOf(c)]);
function bayHTML(b,k,fresh){
  const chips=D.cats.filter(c=>DEF.includes(c.id)||b.cats.includes(c.id)).map(c=>DEF.includes(c.id)
    ?`<button class="chip" type="button" data-cat="${k}:${esc(c.id)}" aria-pressed="${b.cats.includes(c.id)}">${esc(c.name)}</button>`
    :`<span class="chip cchip${c.id===fresh?' new':''}">${esc(c.name)}<button type="button" class="cx" data-catdel="${k}:${esc(c.id)}" aria-label="Usuń ${esc(c.name)} ze stanowiska ${k+1}">×</button></span>`).join('');
  return `<div class="bay${b.isNew?' new':''}" data-bayi="${k}"><span class="no" aria-hidden="true">${k+1}</span>
    <input data-bay="${k}" value="${esc(b.name)}" maxlength="40" aria-label="Nazwa stanowiska ${k+1}" placeholder="Stanowisko ${k+1}">
    <div class="chips" role="group" aria-label="Co robicie na stanowisku ${k+1}">${chips}</div>
    <div class="addcat"><div class="cbx"><input data-newcat="${k}" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="cl-${k}" autocomplete="off" maxlength="30" placeholder="Inna praca, np. Suszenie" aria-label="Dodaj rodzaj pracy na stanowisku ${k+1}"><ul class="cl" id="cl-${k}" role="listbox" aria-label="Podpowiedzi" hidden></ul></div><button type="button" data-act="catadd" data-i="${k}">Dodaj</button></div>
    ${E['bay'+k]?`<span class="err" style="grid-column:2">${SVG(I.alert)}<span>${esc(E['bay'+k])}</span></span>`:''}</div>`;
}
function rebay(k,fresh,focus){const el=document.querySelector(`[data-bayi="${k}"]`);if(!el)return;el.outerHTML=bayHTML(D.bays[k],k,fresh);if(focus){const i=document.querySelector(`[data-newcat="${k}"]`);if(i)i.focus()}}
// podpowiedzi: gotowe rodzaje pracy i te wpisane przy innych stanowiskach, filtrowane w trakcie pisania
const CB={k:-1,items:[],act:-1};
function cbOpen(k){
  const inp=document.querySelector(`[data-newcat="${k}"]`), ul=$('#cl-'+k); if(!inp||!ul) return;
  const q=inp.value.trim(), b=D.bays[k], have=new Set(b.cats.map(id=>norm((D.cats.find(c=>c.id===id)||{}).name)));
  const seen=new Set(), pool=[...D.cats.filter(c=>!DEF.includes(c.id)).map(c=>c.name),...SUG].filter(n=>{const k=norm(n);if(seen.has(k)||have.has(k))return false;seen.add(k);return true});
  let items=pool.filter(n=>!q||norm(n).includes(norm(q))).slice(0,8).map(n=>({n,other:D.cats.some(c=>!DEF.includes(c.id)&&c.name===n)}));
  // pasujące podpowiedzi najpierw (Enter wybiera pierwszą), wpisany tekst jako nowa praca na końcu
  if(q.length>=2&&!pool.concat(D.cats.map(c=>c.name)).some(n=>norm(n)===norm(q))) items.push({n:q,add:true});
  CB.k=k; CB.items=items; CB.act=items.length?0:-1;
  if(!items.length){ul.hidden=true;inp.setAttribute('aria-expanded','false');return}
  const hl=n=>{if(!q)return esc(n);const i=norm(n).indexOf(norm(q));return i<0?esc(n):esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+q.length))+'</mark>'+esc(n.slice(i+q.length))};
  ul.innerHTML=items.map((x,i)=>`<li role="option" id="co-${k}-${i}" data-pick="${i}" aria-selected="${i===CB.act}" class="${x.add?'add':''}">${x.add?`+ Dodaj „${esc(x.n)}”`:hl(x.n)}${x.other?'<small>przy innym stanowisku</small>':''}</li>`).join('');

function check(i){
  const e={};
  if(i===0){
    if(D.owner.trim().length<2) e.owner='Wpisz imię i nazwisko, np. Kamil Lis.';
    if(!D.email.trim()) e.email='Wpisz adres e-mail. Na niego zalogujesz się do panelu.';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(D.email.trim())) e.email=D.email.includes('@')?'W adresie brakuje domeny, np. imie@twojsalon.pl.':'W adresie brakuje znaku @, np. imie@twojsalon.pl.';
    else if(emailTaken) e.email='Ten e-mail ma już konto. Zaloguj się albo użyj innego adresu.';
    if(D.pw.length<8) e.pw=D.pw?`Hasło ma ${D.pw.length} ${pl(D.pw.length,'znak','znaki','znaków')}, potrzeba co najmniej 8.`:'Ustaw hasło, co najmniej 8 znaków.';
    if(!D.terms) e.terms='Zaznacz akceptację regulaminu, żeby założyć konto.';
  }
  if(i===1){
    if(D.salon.trim().length<2) e.salon='Wpisz nazwę salonu, tak jak widzą ją klienci.';
    if(!phoneOk(D.phone)) e.phone=digits(D.phone).length?'Numer ma mieć 9 cyfr, np. 600 100 200 albo +48 600 100 200.':'Wpisz telefon salonu.';
    if(D.zip&&!/^\d{2}-\d{3}$/.test(D.zip)) e.zip='Kod pocztowy ma format 00-000.';
    if(D.nip&&!nipOk(D.nip)) e.nip=digits(D.nip).length!==10?`NIP ma 10 cyfr, wpisano ${digits(D.nip).length}.`:'Ten NIP ma błędną cyfrę kontrolną. Sprawdź, czy nie ma literówki.';
    if(D.week[0]>=D.week[1]) e.week='Godzina zamknięcia musi być po otwarciu.';
    if(D.sat&&D.satT[0]>=D.satT[1]) e.sat='W sobotę zamknięcie musi być po otwarciu.';
    if(D.sun&&D.sunT[0]>=D.sunT[1]) e.sun='W niedzielę zamknięcie musi być po otwarciu.';
  }
  if(i===2) D.bays.forEach((b,k)=>{if(!b.cats.length) e['bay'+k]='Zaznacz, co robicie na tym stanowisku.'});
  if(i===3&&!D.solo) D.team.forEach((m,k)=>{if(m.name.trim().length<2) e['mem'+k]='Wpisz imię albo usuń wiersz.'});
  if(i===4&&!D.svcSkip){
    if(!D.svcs.some(x=>x.on)) e.svc='Zaznacz co najmniej jedną usługę albo pomiń ten krok.';
    D.svcs.forEach((x,k)=>{if(!x.on)return;if(!x.tpl&&x.name.trim().length<3)e['sn'+k]='Wpisz nazwę usługi, np. Suszenie auta.';if(!(+x.price>0))e['sp'+k]='Podaj cenę od, np. 150.';if(!(+x.dur>0))e['sd'+k]='Podaj czas.'});
  }
  return e;
}

  return `<div><h1>Wszystko gotowe, sprawdź dane</h1><p class="lead">Po kliknięciu „Utwórz panel” założymy konto i od razu Cię zalogujemy. Przy pierwszym wejściu krótki samouczek pokaże najważniejsze miejsca.</p></div>

  ${E.emailfix?`<div class="emailfix" role="alert"><h2>Ten e-mail ma już konto</h2><p>Wpisz inny adres i kliknij „Utwórz panel” jeszcze raz. Reszta danych zostaje. Jeśli to Twoje konto, <a href="salon.html#panel">zaloguj się</a>.</p>

  <dl class="sum" style="margin:0">
    ${row('Konto',`${esc(D.owner)}<small>${esc(D.email)} · plan ${PNAME[D.plan]}, ${pp(D.plan)}</small>`,0)}
    ${row('Salon',`${esc(D.salon)}<small>${esc([D.addr,[D.zip,D.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')||'adres dodasz później')} · ${esc(D.phone)}</small><small>${esc(hoursTxt())}</small>`,1)}
    ${row('Stanowiska',`${D.bays.length} ${pl(D.bays.length,'stanowisko','stanowiska','stanowisk')}<small>${esc(D.bays.map(b=>b.name||'bez nazwy').join(', '))}</small>`,2)}
    ${row('Zespół',team,3)}
    ${row('Usługi',D.svcSkip?'Przykładowy cennik<small>zmienisz w panelu, zakładka Cennik</small>':`${D.svcs.filter(x=>x.on).length} ${pl(D.svcs.filter(x=>x.on).length,'usługa','usługi','usług')}<small>${esc(D.svcs.filter(x=>x.on).map(x=>`${x.name} od ${+x.price} zł${x.staff.length?' ('+x.staff.join(', ')+')':''}`).join(', '))}</small>`,4)}
    ${row('Funkcje',`${featOn().length} z ${FEATS.length} do wyboru<small>${esc(featOn().map(f=>f[1]).join(', ')||'tylko podstawowe')}</small>${D.wish.trim()?`<small>Twoja propozycja: „${esc(D.wish.trim().slice(0,120))}${D.wish.trim().length>120?'…':''}”</small>`:''}`,5)}
  </dl>
  <div class="linkbox">Link do rezerwacji dla klientów: <b>${esc(bookingLink())}</b></div>
  <label class="check"><input type="checkbox" data-k="sample" ${D.sample?'checked':''}><span><b>Wypełnij panel przykładowymi wizytami</b><br>Zobaczysz, jak wygląda dzień pracy, i przejdziesz samouczek na żywych danych. Usuniesz je jednym przyciskiem w Ustawieniach.</span></label>
  <div class="pv inline" id="pv-in" aria-label="Podgląd Twojego panelu"></div>`;
}
const VIEWS=[vKonto,vFirma,vStan,vZespol,vUslugi,vFunkcje,vStart];

/* ---------- podgląd panelu na żywo ---------- */
function preview(){
  const it=(l,cur,cls='')=>`<div class="m-it${cur?' cur':''} ${cls}">${l}</div>`;
  const NAV={wyc:'Wyceny',gw:'Gwarancje',wl:'Lista rezerwowa',bon:'Bony',dzis:'Statystyki',google:'Google',zes:'Zespół'};
  const menuF=featOn().filter(f=>NAV[f[0]]);
  const grp=(h,list,extra='')=>list.length||extra?`<div class="m-gh">${h}</div>${list.map(f=>it(NAV[f[0]])).join('')}${extra}`:'';
  const people=[{name:D.owner||'Ty',c:'#ea580c'},...(D.solo?[]:D.team.filter(m=>m.name.trim()).map((m,i)=>({name:m.name,c:COLORS[i%6]})))];
  const ev=[[8,25,''],[42,30,'b'],[15,40,'b'],[60,22,''],[30,35,''],[5,50,'b']];
  return `<div class="pv-h">Podgląd Twojego panelu</div>
  <div class="mock" aria-hidden="true">
    <div class="m-side"><div class="m-logo"><i></i>${esc(first(D.salon)||'Twój salon')}</div><div class="m-new">+ Nowa rezerwacja</div>
      ${it('Start',1)}${it('Kalendarz')}${it('Rezerwacje')}${it('Klienci')}
      ${grp('Sprzedaż',menuF.filter(f=>f[3]==='Sprzedaż'))}${grp('Salon',menuF.filter(f=>f[3]==='Salon'),it('Cennik')+it('Ustawienia'))}</div>
    <div class="m-main"><div class="m-hi">Dzień dobry, ${esc(first(D.owner)||'Kamil')}</div><div class="m-sub">${esc(D.salon||'Twój salon')}${D.city?' · '+esc(D.city):''}</div>
      <div class="m-pills"><div><b>${D.sample?3:0}</b><span>czeka</span></div><div><b>${D.sample?Math.min(9,D.bays.length*2+1):0}</b><span>aut dziś</span></div><div><b>${featOn().some(f=>f[0]==='wl')&&D.sample?2:0}</b><span>lista rez.</span></div></div>
      <div class="m-lanes">${D.bays.slice(0,6).map((b,k)=>{const e=ev[k%ev.length];return `<div class="m-lane"><span>${esc(b.name||'Stanowisko '+(k+1))}</span><div>${D.sample?`<i class="${e[2]}" style="left:${e[0]}%;width:${e[1]}%"></i>`:''}</div></div>`}).join('')}${D.bays.length>6?`<span class="m-more">+${D.bays.length-6} ${pl(D.bays.length-6,'stanowisko','stanowiska','stanowisk')}</span>`:''}</div>
      <div class="m-team">${people.slice(0,6).map(p=>`<span class="m-av" style="background:${p.c}">${esc((first(p.name)[0]||'?').toUpperCase())}</span>`).join('')}${people.length>6?`<span class="m-more">+${people.length-6}</span>`:''}<span class="m-more">${people.length} ${pl(people.length,'osoba','osoby','osób')}</span></div>
    </div></div>
  <p class="pv-n">Menu ma ${4+menuF.length+2} pozycji. ${featOn().some(f=>f[0]==='tg')?'Nowe rezerwacje przyjdą też na Telegram.':''}</p>`;
}
function renderPreview(){const a=$('#pv'),b=$('#pv-in'),h=preview();if(a&&getComputedStyle(a).display!=='none')a.innerHTML=h;if(b)b.innerHTML=h}

/* ---------- render ---------- */
let ANIM='';
function render(focus){
  const card=$('#card');
  $('#steps').innerHTML=STEPS.map(([k,l],i)=>`<li class="${i<step?'done':i===step?'cur':''}"><button type="button" data-go="${i}" ${i>step?'disabled':''} ${i===step?'aria-current="step"':''}><span><span class="n">${i+1}.</span> ${l}</span></button></li>`).join('');
  $('#mstep').innerHTML=`<span>Krok <b>${step+1} z ${STEPS.length}</b> · ${STEPS[step][1]}</span><span class="bar"><i style="width:${(step+1)/STEPS.length*100}%"></i></span>`;
  const last=step===STEPS.length-1;
  const back=step?`<button class="btn sec" type="button" data-act="back">Wstecz</button>`:'';
  const next=last?`<button class="btn pri" type="button" data-act="submit">Utwórz panel</button>`:`<button class="btn pri" type="button" data-act="next">Dalej: ${STEPS[step+1][1]}</button>`;
  card.innerHTML=`<form class="pane ${ANIM}" id="pane" novalidate>${VIEWS[step]()}<div class="acts desk">${back}<span class="sp"></span><span class="save" id="save"></span>${next}</div></form>`;
  $('#mbar').innerHTML=`${back}${last?`<button class="btn pri" type="button" data-act="submit">Utwórz panel</button>`:`<button class="btn pri" type="button" data-act="next">Dalej</button>`}`;
  document.title=`${STEPS[step][1]} · Załóż panel · Detailo`;
  renderPreview(); pwMeter();
  ANIM='';
  if(focus){const bad=card.querySelector('[aria-invalid=true]'),h=card.querySelector('h1');if(bad)bad.focus();else if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
}
function go(i,push=true){
  if(making) return;
  i=Math.max(0,Math.min(STEPS.length-1,i));
  let err={};
  for(let k=0;k<i;k++){const e=check(k);if(Object.keys(e).length){i=k;err=e;break}}
  E=err; ANIM=i>step?'fwd':i<step?'back':''; step=i; if(push&&location.hash!=='#'+STEPS[i][0]) history.pushState(null,'','#'+STEPS[i][0]);
  render(true); window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
function next(){E=check(step);if(Object.keys(E).length){render(true);return}go(step+1)}
let saveT;
function touched(){const P=people();D.svcs.forEach(x=>{x.staff=x.staff.filter(n=>P.includes(n))});saveDraft();clearTimeout(saveT);const s=$('#save');if(s){s.textContent='Zapisano na tym urządzeniu';saveT=setTimeout(()=>{if($('#save'))$('#save').textContent=''},1800)}renderPreview()}
function pwMeter(){const m=$('#pwm');if(!m)return;const p=D.pw,sc=p.length<8?Math.min(1,p.length/8)*.33:.33+Math.min(.67,(p.length-8)/8*.67+(/[^a-zA-Z]/.test(p)?.2:0));m.style.width=Math.min(100,sc*100)+'%';m.style.background=p.length<8?'#a8a29e':sc>.7?'#15803d':'#c2410c'}

/* ---------- zdarzenia ---------- */
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(t.dataset.newcat!=null){cbOpen(+t.dataset.newcat);return}
  if(k){
    if(t.type==='checkbox') D[k]=t.checked;
    else if(k==='zip'){let d=digits(t.value).slice(0,5);if(d.length>2)d=d.slice(0,2)+'-'+d.slice(2);t.value=d;D.zip=d}
    else D[k]=t.value;
    if(k==='email'){emailTaken=false;D.emailOk=false}
    if(k==='wish'){const h=t.parentElement.querySelector('.hint');if(h)h.textContent=D.wish.length+'/1000'}
    if(k==='salon'){const h=$('#h-salon');if(h)h.innerHTML=D.salon.trim()?`Twój link do rezerwacji: <b>…/salon.html?salon=${esc(slugify(D.salon))}</b>`:'Taka, jak na szyldzie i w wizytówce Google.'}
    if(k==='pw') pwMeter();
    // poprawione pole przestaje świecić na czerwono od razu, bez czekania na „Dalej”
    if(E[k]&&!check(step)[k]){delete E[k];t.removeAttribute('aria-invalid');const er=$('#e-'+k);if(er)er.remove();if(k==='terms')t.closest('.check').classList.remove('bad')}
    touched(); return;
  }
  if(t.dataset.bay!=null){D.bays[+t.dataset.bay].name=t.value;touched();return}
  if(t.dataset.mem){const [i,f]=t.dataset.mem.split(':');D.team[+i][f]=f==='commission'?Math.max(0,Math.min(50,Math.round(+t.value||0))):t.value;
    if(f==='name'&&E['mem'+i]&&t.value.trim().length>=2){delete E['mem'+i];t.removeAttribute('aria-invalid');const er=t.parentElement.querySelector('.err');if(er)er.remove()}touched();return}
  if(t.dataset.t){const key=t.dataset.t.slice(0,-1),i=+t.dataset.t.slice(-1);D[key][i]=t.value;touched();return}
  if(t.dataset.sv){const [i,f]=t.dataset.sv.split(':'),x=D.svcs[+i];x[f]=['price','dur'].includes(f)?(t.value===''?'':+t.value):t.value;
    const ek={name:'sn',price:'sp',dur:'sd'}[f]+i;if(E[ek]&&!check(4)[ek]){delete E[ek];t.removeAttribute('aria-invalid');const sv=t.closest('.svc');sv&&sv.querySelectorAll('.err').forEach(er=>{if(er.dataset.e===ek)er.remove()})}
    if(f==='price'&&x.tpl){const sm=t.closest('.svc').querySelector('.nm small');if(sm)sm.textContent=`${catName(x.cat)} · od ${+x.price||0} zł`}
    touched();return}
});
document.addEventListener('change',e=>{if(e.target.dataset.k==='plan'){D.upsell=null;touched();step===5?patchFeats():render();return}if(e.target.dataset.sv&&/:(cat|unit)$/.test(e.target.dataset.sv)){touched();render();return}if(e.target.dataset.t){touched()}if(e.target.dataset.mem&&e.target.dataset.mem.endsWith(':role'))touched()});
document.addEventListener('focusout',async e=>{
  if(e.target.dataset.k!=='email') return;
  const m=D.email.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return;
  const {data,error}=await sb.rpc('email_free',{p_email:m});
  if(error||D.email.trim()!==m) return;
  emailTaken=data===false; D.emailOk=data===true;
  const lab=e.target.closest('.f'); if(!lab||step!==0) return;
  lab.querySelectorAll('.err,.hint,.okm').forEach(x=>x.remove());
  if(emailTaken){E.email='Ten e-mail ma już konto. Zaloguj się albo użyj innego adresu.';e.target.setAttribute('aria-invalid','true');lab.insertAdjacentHTML('beforeend',`<span class="err" id="e-email">${SVG(I.alert)}<span>${E.email} <a href="salon.html#panel">Zaloguj się</a></span></span>`)}
  else{delete E.email;e.target.removeAttribute('aria-invalid');lab.insertAdjacentHTML('beforeend','<span class="okm">Adres wolny</span>')}
});
document.addEventListener('submit',e=>{e.preventDefault();step===STEPS.length-1?submit():next()});
document.addEventListener('focusin',e=>{if(e.target.dataset.newcat!=null)cbOpen(+e.target.dataset.newcat)});
document.addEventListener('focusout',e=>{if(e.target.dataset.newcat!=null)setTimeout(()=>{if(!document.activeElement||document.activeElement.dataset.newcat==null)cbClose()},120)});
document.addEventListener('mousedown',e=>{const li=e.target.closest('[data-pick]');if(!li)return;e.preventDefault();const k=CB.k,x=CB.items[+li.dataset.pick];if(x)addCat(k,x.n)});
document.addEventListener('keydown',e=>{
  if(e.target.dataset.newcat!=null){const k=+e.target.dataset.newcat;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(CB.k!==k)cbOpen(k);else cbMove(e.key==='ArrowDown'?1:-1);return}
    if(e.key==='Escape'){if(CB.k===k){e.preventDefault();cbClose()}return}
    if(e.key==='Enter'){e.preventDefault();const x=CB.k===k&&CB.act>=0&&CB.items[CB.act];addCat(k,x?x.n:null);return}
    return}
  if(e.key!=='Enter')return;
  if(e.target.matches('#pane input:not([type=checkbox])')){e.preventDefault();step===STEPS.length-1?submit():next()}});
// nowy rodzaj pracy: z podpowiedzi albo wpisany; ten sam (bez względu na wielkość liter) nie dubluje się
// nowa praca trafia tylko do tego stanowiska; ta sama nazwa przy innym stanowisku = ten sam rodzaj pracy
function addCat(k,val){
  const inp=document.querySelector(`[data-newcat="${k}"]`), name=(val!=null?val:(inp&&inp.value||'')).trim().replace(/\s+/g,' ').slice(0,30);
  if(name.length<2){if(inp)inp.focus();return}
  let c=D.cats.find(x=>norm(x.name)===norm(name));
  if(!c){if(D.cats.length>=12)return;let id=slugify(name);while(D.cats.some(x=>x.id===id))id=id.slice(0,26)+'-'+(D.cats.length+1);c={id,name};D.cats.push(c)}
  const b=D.bays[k]; if(!b.cats.includes(c.id)) b.cats.push(c.id);
  delete E['bay'+k]; cbClose(); touched(); rebay(k,c.id,true);
}
function delCat(k,id){
  const b=D.bays[k]; b.cats=b.cats.filter(x=>x!==id);
  if(!D.bays.some(x=>x.cats.includes(id))&&!D.svcs.some(x=>x.cat===id)) D.cats=D.cats.filter(c=>c.id!==id);
  touched(); rebay(k);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t||making) return;
  const a=t.dataset.act;
  if(t.dataset.go!=null){go(+t.dataset.go);return}
  if(a==='next'){next();return}
  if(a==='back'){go(step-1);return}
  if(a==='submit'){submit();return}
  if(a==='eye'){const i=$('#i-pw'),on=i.type==='password';i.type=on?'text':'password';t.setAttribute('aria-pressed',on);t.setAttribute('aria-label',on?'Ukryj hasło':'Pokaż hasło');t.innerHTML=SVG(on?I.eyeoff:I.eye);return}
  if(a==='reset'){try{localStorage.removeItem(DRAFT)}catch(_){}D=fresh();if(PLANS[qp])D.plan=qp;E={};render(true);return}
  if(t.dataset.sw){D[t.dataset.sw]=!D[t.dataset.sw];touched();render();return}
  if(a==='bay+'&&D.bays.length<10){const n=D.bays.length+1;D.bays.push({name:'Stanowisko '+n,cats:['mycie','lakier'],isNew:1});render();delete D.bays[n-1].isNew;touched();return}
  if(a==='bay-'&&D.bays.length>1){D.bays.pop();touched();render();return}
  // przełączenie pracy bez przerysowania kroku: nic nie skacze
  if(t.dataset.cat){const [k,c]=t.dataset.cat.split(':'),b=D.bays[+k];b.cats=b.cats.includes(c)?b.cats.filter(x=>x!==c):[...b.cats,c];t.setAttribute('aria-pressed',b.cats.includes(c));
    if(E['bay'+k]&&b.cats.length){delete E['bay'+k];const er=t.closest('.bay').querySelector('.err');if(er)er.remove()}touched();return}
  if(t.dataset.catdel){const [k,c]=t.dataset.catdel.split(':');delCat(+k,c);return}
  if(a==='solo'||a==='team'){D.solo=a==='solo';if(!D.solo&&!D.team.length)D.team.push({name:'',role:'worker',commission:10});if(!D.featsTouched)D.feats.zes=!D.solo;touched();render();if(!D.solo){const i=document.querySelector('[data-mem$=":name"]');if(i&&!i.value)i.focus()}return}
  if(a==='mem+'){D.team.push({name:'',role:'worker',commission:10,isNew:1});render();delete D.team[D.team.length-1].isNew;touched();const l=[...document.querySelectorAll('[data-mem$=":name"]')].pop();if(l)l.focus();return}
  if(a==='mem-'){D.team.splice(+t.dataset.i,1);E={};if(!D.team.length)D.solo=true;touched();render();return}
  if(t.dataset.feat){const k=t.dataset.feat;
    if(locked(k)){D.upsell=k;patchFeats();const u=$('.up');if(u)u.scrollIntoView({block:'nearest',behavior:'smooth'});return}
    if(k==='zes'&&hasTeam())return;
    D.feats[k]=!D.feats[k];D.featsTouched=true;touched();patchFeats();return}
  if(a==='upgrade'){D.plan=t.dataset.plan;if(D.upsell)D.feats[D.upsell]=true;D.upsell=null;touched();step===5?patchFeats():render();return}
  if(a==='upno'){D.upsell=null;patchFeats();return}
  if(t.dataset.bill){D.billing=t.dataset.bill;touched();document.querySelectorAll('[data-bill]').forEach(b=>b.setAttribute('aria-checked',b.dataset.bill===D.billing));document.querySelectorAll('select[data-k=plan] option').forEach(o=>o.textContent=`${PNAME[o.value]} · ${pp(o.value)}`);return}
  if(a==='catadd'){const k=+t.dataset.i,it=CB.k===k&&CB.items[CB.act];addCat(k,it&&!document.querySelector(`[data-newcat="${k}"]`).value.trim()?it.n:null);return}
  if(a==='skipsvc'){D.svcSkip=true;touched();next();return}
  if(a==='svcback'){D.svcSkip=false;touched();render();return}
  if(t.dataset.svc!=null){const x=D.svcs[+t.dataset.svc];x.on=!x.on;delete E.svc;touched();render();return}
  if(t.dataset.staff!=null){const x=D.svcs[+t.dataset.staff],n=t.dataset.n;x.staff=x.staff.includes(n)?x.staff.filter(y=>y!==n):[...x.staff,n];touched();t.setAttribute('aria-pressed',x.staff.includes(n));return}
  if(a==='svc+'){D.svcs.push({name:'',cat:D.cats[D.cats.length-1].id,price:'',unit:'h',dur:1,on:true,staff:[]});touched();render();const l=[...document.querySelectorAll('input.nm')].pop();if(l)l.focus();return}
  if(a==='svc-'){D.svcs.splice(+t.dataset.i,1);E={};touched();render();return}
  if(a==='all'){const free=FEATS.filter(f=>!locked(f[0])),on=featOn().length!==free.length;free.forEach(f=>D.feats[f[0]]=on);D.featsTouched=true;touched();patchFeats();return}
  // polecany zestaw: z zespołem prowizje i statystyki, jedno stanowisko bez listy rezerwowej i Google (mniej do ogarnięcia na start)
  if(a==='rec'){const big=D.bays.length>1;Object.assign(D.feats,{wyc:true,gw:true,wl:big,bon:true,loy:true,dzis:big||!D.solo,google:false,zes:!D.solo,tg:true});D.featsTouched=true;touched();patchFeats();return}
  if(t.dataset.idea){const x=t.dataset.idea;D.wish=(D.wish.trim()?D.wish.trim()+'\n':'')+x+': ';touched();render();const w=$('#i-wish');if(w){w.focus();w.setSelectionRange(w.value.length,w.value.length)}return}
});
window.addEventListener('popstate',()=>{const i=STEPS.findIndex(s=>'#'+s[0]===location.hash);go(i<0?0:i,false)});
matchMedia('(max-width:1020px)').addEventListener('change',renderPreview);

/* ---------- utworzenie panelu ---------- */
async function submit(){
  const bad=firstBad();
  if(bad===0&&Object.keys(check(0)).every(x=>x==='email')&&emailTaken){E={emailfix:1};render(true);return}
  if(bad>-1){E=check(bad);if(bad!==step)go(bad);else render(true);return}
  making=true;
  const card=$('#card'); $('#mbar').innerHTML='';
  const L=['Zakładam konto','Tworzę salon i stanowiska',D.solo?'Ustawiam Twój profil':'Dodaję zespół',D.svcSkip?'Wstawiam przykładowy cennik':'Dodaję usługi i ceny','Włączam wybrane funkcje','Loguję do panelu'];
  card.innerHTML=`<div class="making pane in" role="status"><div><h1>Uruchamiam panel ${esc(D.salon)}</h1><p class="lead">To potrwa kilka sekund.</p></div><ol>${L.map(x=>`<li><i></i>${x}</li>`).join('')}</ol></div>`;
  const li=[...card.querySelectorAll('li')], tick=i=>li.forEach((x,k)=>x.className=k<i?'ok':k===i?'run':'');
  const wait=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion:reduce)').matches?0:ms));
  tick(0);
  const p={p_owner:D.owner.trim(),p_email:D.email.trim(),p_password:D.pw,
    p_salon:{name:D.salon.trim(),phone:D.phone.trim(),addr:D.addr.trim(),city:[D.zip,D.city.trim()].filter(Boolean).join(' '),hours:hoursTxt(),nip:digits(D.nip)},
    p_bays:D.bays.map((b,i)=>({name:b.name.trim()||'Stanowisko '+(i+1),cats:b.cats})),
    p_team:D.solo?[]:D.team.filter(m=>m.name.trim()).map(m=>({name:m.name.trim(),role:m.role,commission:+m.commission||0})),
    p_features:Object.fromEntries(FEATS.map(f=>[f[0],!locked(f[0])&&fOn(f[0])])),p_wish:D.wish.trim()||null,p_sample:D.sample,p_plan:D.plan,p_billing:D.billing,
    p_cats:D.cats.filter(c=>['mycie','lakier'].includes(c.id)||D.bays.some(b=>b.cats.includes(c.id))||D.svcs.some(x=>x.on&&x.cat===c.id)),
    p_services:D.svcSkip?null:D.svcs.filter(x=>x.on).map(x=>({tpl:x.tpl||null,name:x.tpl?null:x.name.trim(),cat:x.cat,price:+x.price,unit:x.unit,dur:+x.dur,staff:x.staff}))};
  const {data:slug,error}=await sb.rpc('studio_register',p);
  if(error){making=false;
    const msg=error.message||'';
    if(/EMAIL:/.test(msg)){emailTaken=true;E={emailfix:1};step=STEPS.length-1;render(true);return}
    E={submit:/fetch|network/i.test(msg)?'Brak połączenia z internetem. Dane są zapisane, spróbuj jeszcze raz.':/LIMIT:/.test(msg)?msg.replace(/^.*LIMIT:\s*/,''):/function|schema cache/i.test(msg)?'Rejestracja chwilowo nie działa (baza bez aktualnego schematu). Napisz do nas, uruchomimy panel ręcznie.':msg||'Coś poszło nie tak. Spróbuj jeszcze raz.'};
    step=STEPS.length-1; render(true); return}
  for(let i=1;i<5;i++){await wait(360);tick(i)}
  const {error:le}=await sb.auth.signInWithPassword({email:D.email.trim(),password:D.pw});
  try{localStorage.removeItem(DRAFT)}catch(_){}
  tick(6); await wait(450);
  location.href=`salon.html?salon=${encodeURIComponent(slug)}#panel`;
  if(le) console.warn('logowanie po rejestracji',le.message); // panel pokaże wtedy ekran logowania z pustym hasłem
}

/* ---------- start ---------- */
{const i=STEPS.findIndex(s=>'#'+s[0]===location.hash);step=0;ANIM='in';if(i>0){go(i,false)}else{history.replaceState(null,'','#'+STEPS[0][0]);render(false)}}
</script>
